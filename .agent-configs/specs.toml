#:schema https://raw.githubusercontent.com/companionintelligence/CI-Agent-Sync/main/integrations/verification/specs.schema.json
# Spec registry: the formal and executable specifications this repo keeps.
version = 1
repo = "companion-avatar"

[[spec]]
id = "component-stories"
title = "Core UI components: every story renders, its play function passes, and axe finds no violation"
kind = "component"
tool = "storybook"
status = "conformance"
gate = "advisory"
artefacts = [
  "apps/web/.storybook/main.ts",
  "apps/web/.storybook/preview.tsx",
  "apps/web/vitest.config.ts",
  "apps/web/tsconfig.stories.json",
  "apps/web/vitest.witness.config.ts",
  "apps/web/.storybook-witness/main.ts",
  "apps/web/.storybook-witness/preview.ts",
  "apps/web/.storybook-witness/PlantedViolations.stories.tsx",
  "scripts/check-stories.mjs",
  "packages/core/src/components/chat/ChatBubble.stories.tsx",
  "packages/core/src/components/chat/ChatInput.stories.tsx",
  "packages/core/src/components/chat/ChatPanel.stories.tsx",
  "packages/core/src/components/common/ControlButton.stories.tsx",
  "packages/core/src/components/common/LogoOverlay.stories.tsx",
  "packages/core/src/components/common/OnboardingOverlay.stories.tsx",
  "packages/core/src/components/common/ToggleButton.stories.tsx",
  "packages/core/src/components/common/Tooltip.stories.tsx",
  "packages/core/src/components/control/ControlPanel.stories.tsx",
  "packages/core/src/components/control/SettingsPanel.stories.tsx",
  "packages/core/src/components/debug/BlendTimeline.stories.tsx",
  "packages/core/src/components/debug/EmotePalette.stories.tsx",
  "packages/core/src/components/debug/VisemeMeter.stories.tsx",
]
covers = [
  "packages/core/src/components/chat/**",
  "packages/core/src/components/common/**",
  "packages/core/src/components/control/**",
  "packages/core/src/components/debug/**",
  "packages/core/src/styles/**",
  "apps/web/.storybook/**",
  "apps/web/.storybook-witness/**",
  "apps/web/vite.config.ts",
  "apps/web/vitest.config.ts",
  "apps/web/vitest.witness.config.ts",
  "apps/web/tsconfig.stories.json",
  "scripts/check-stories.mjs",
]
docs = ["TESTING.md", "docs/TESTING-PIPELINE.md"]
requires = ["node"]
check = ["pnpm", "run", "--silent", "check:stories"]
properties = ["everyStoryRenders", "everyPlayFunctionPasses", "noAxeViolations", "everyStoryTypechecks"]
conformance = "The stories render the shipped components from packages/core/src in headless Chromium; there is no separate model."
target = "AV-4"
notes = '''
The check, scripts/check-stories.mjs, passes only when the stories typecheck, the planted-bug witness in apps/web/.storybook-witness fails on button-name and image-alt, and Vitest reports that every story passed. To watch the witness fail: pnpm --filter @ci-avatar/web exec vitest run -c vitest.witness.config.ts.

axe runs its default rules (WCAG 2.0 and 2.1 A and AA, and best practices). Storybook turns off region, and axe leaves the WCAG 2.2 target-size rule off.

Gaps against AV-4. Exported DOM components with no story: ChatOverlay and ControlOverlay, and AvatarStatusPill and AvatarCaptionOverlay in components/avatar, outside covers. ConnectionStatusPanel renders only inside the SettingsPanel stories. AvatarControls, not exported and outside covers, has none. The WebGL and React Three Fiber components (components/scene, XRControlPanel, AvatarLightingRig) have no stories, and axe cannot see into a canvas. Every story runs at the addon's 1200 by 900 viewport, so the phone layouts (window.innerWidth of 768 or less) in ChatPanel, ChatInput and SettingsPanel never render.

requires lists node only. The frozen install provides Storybook 10.6.9 to the package scripts, which set STORYBOOK_DISABLE_TELEMETRY=1. Agent-Sync's storybook probe looks in the repository root's node_modules/.bin, and pnpm links the storybook bin in apps/web only.

The first run needs Playwright's Chromium: pnpm --filter @ci-avatar/web exec playwright install chromium.
'''

[[spec]]
id = "conversation-machine"
title = "ConversationMachine: the transition table is total, illegal events are counted, and no turn is left thinking or interrupted"
kind = "state-machine"
tool = "quint"
status = "planned"
covers = [
  "packages/engine/src/conversation/ConversationMachine.ts",
  "packages/core/src/services/conversation/useConversationService.ts",
  "packages/core/src/services/llm/llmInterrupt.ts",
]
target = "AV-1"
notes = "Model the TRANSITIONS table and replay its ITF traces against ConversationMachine in a node test."

[[spec]]
id = "engine-pure-functions"
title = "Pure engine functions: history budget, breath split and inline cue parsing"
kind = "algorithm"
tool = "lemmascript"
status = "planned"
covers = [
  "packages/core/src/services/conversation/historyBudget.ts",
  "packages/core/src/services/llm/models/breathSplit.ts",
  "packages/core/src/services/cues/inlineCues.ts",
]
target = "AV-2"
notes = "The other half of AV-2, the face-rig write contract, is face-rig-write-contract."

[[spec]]
id = "face-rig-write-contract"
title = "Face rigs: every rig holds the last weight written for a key until that key is written again"
kind = "invariant"
tool = "property"
status = "planned"
covers = [
  "packages/engine/src/face/types.ts",
  "packages/engine/src/face/FaceCompositor.ts",
  "packages/engine/src/face/rigs/morphTargetRig.ts",
  "packages/engine/src/face/rigs/vrmExpressionRig.ts",
]
target = "AV-2"
notes = "A differential property test: generated write sequences go through the real FaceCompositor to both rigs, and each must keep the last weight written for a key on the avatar until that key is written again. The compositor writes a weight that holds steady only once, so a rig that drops it between writes shows as flicker. rigs.node.test.ts and vrmHeldWeights.node.test.ts check single cases today."

[[spec]]
id = "proxy-wire-contracts"
title = "Proxy and agent-tool wire contracts: request bodies, stream frames and tool parameters"
kind = "data-contract"
tool = "effect-schema"
status = "planned"
covers = [
  "apps/proxy/src/routes/chat.ts",
  "apps/proxy/src/routes/talk.ts",
  "apps/proxy/src/upstreams/types.ts",
  "apps/proxy/src/upstreams/index.ts",
  "packages/agent/src/tools/toolRegistry.ts",
]
target = "AV-3"
