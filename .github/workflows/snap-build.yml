name: Snap build

# Builds the Snap (snap/snapcraft.yaml) from the dispatched ref and attaches the .snap to the run. It
# publishes only when `publish` names a Snap Store channel, and then only with the
# SNAPCRAFT_STORE_CREDENTIALS repository secret (docs/PUBLISHING.md). Manual dispatch only, like every
# workflow in this repo (docs/CI.md):
#
#   gh workflow run snap-build.yml --repo companionintelligence/Companion-Avatar --ref main
#   gh workflow run snap-build.yml --repo companionintelligence/Companion-Avatar --ref main -f publish=edge
#
# The snap is built from source inside the snapcraft build environment, which has network access
# here (a Launchpad remote build does not, so it cannot build this snap). snapcraft.yaml says
# `grade: devel`, which the store accepts for edge and beta only.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Snap Store channel to release to after the build (none builds and stops)
        required: true
        default: none
        type: choice
        options:
          - none
          - edge
          - beta
          - candidate
          - stable

permissions:
  contents: read

env:
  # Inputs reach scripts through the environment, never by interpolation into a script.
  CHANNEL: ${{ inputs.publish }}

jobs:
  build:
    name: Build the snap
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    outputs:
      snap: ${{ steps.build.outputs.snap }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: build

      # The snap's own contents, so a build that lost the app fails here, not on a user's desktop.
      - name: Check the snap carries the app
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          set -euo pipefail
          sudo apt-get install -y squashfs-tools
          unsquashfs -l "$SNAP_FILE" > "$RUNNER_TEMP/snap.txt"
          for path in usr/bin/avatar-companion-desktop meta/snap.yaml meta/gui/avatar-companion.desktop meta/gui/icon.png; do
            grep -Fq "squashfs-root/$path" "$RUNNER_TEMP/snap.txt" || { echo "::error::$path is not in the snap."; exit 1; }
          done
          grep -Eq 'THIRD-PARTY-NOTICES\.txt' "$RUNNER_TEMP/snap.txt" || { echo "::error::The third-party notices are not in the snap."; exit 1; }
          ls -la "$SNAP_FILE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avatar-companion-snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Release to the Snap Store
    needs: build
    if: inputs.publish != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Add required reviewers to this environment in the repository settings to gate the upload.
    environment: snap-store
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: avatar-companion-snap
          path: snap

      - name: Find the snap
        id: file
        run: |
          set -euo pipefail
          file="$(ls snap/*.snap)"
          echo "snap=$file" >> "$GITHUB_OUTPUT"

      - uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.file.outputs.snap }}
          release: ${{ env.CHANNEL }}
