[package]
name = "avatar-companion-desktop"
version = "0.1.0"
description = "Avatar Companion desktop shell (Tauri 2) around the web app"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
