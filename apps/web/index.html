<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/2024_CI__Logo_Banner_Color.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) report the notch and home indicator in the native shells. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#041620" />
    <meta name="color-scheme" content="dark" />
    <!-- Installable as an app: public/manifest.webmanifest has display: standalone, and the
         worker (public/sw.js, registered from src/lib/registerServiceWorker.ts) answers an
         offline launch with /offline/. apple-mobile-web-app-title is the label under the
         home-screen icon on iOS, which would otherwise take it from <title>. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Avatar" />
    <!-- Manrope is self-hosted via @fontsource (see main.tsx) so it works offline
         in the appliance container; no external font CDN. -->
    <meta
      name="description"
      content="Avatar Companion — an embodied AI companion with a 3D avatar, voice interaction, and WebXR support, part of the Companion Intelligence platform."
    />
    <title>Avatar Companion</title>
    <link rel="canonical" href="https://avatar.ci.computer/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Companion Intelligence" />
    <meta property="og:title" content="Avatar Companion" />
    <meta
      property="og:description"
      content="Avatar Companion — an embodied AI companion with a 3D avatar, voice interaction, and WebXR support, part of the Companion Intelligence platform."
    />
    <meta property="og:url" content="https://avatar.ci.computer/" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Avatar Companion" />
    <meta
      name="twitter:description"
      content="Avatar Companion — an embodied AI companion with a 3D avatar, voice interaction, and WebXR support, part of the Companion Intelligence platform."
    />
